# Publishes a snapshot Docker image, tagged with the Maven version (e.g. 1.0.9-SNAPSHOT), on every push to main.
#
# Nothing is published when main holds a release version, so a release image is never overwritten by later commits.
name: Snapshot Docker image

on:
  push:
    branches:
      - main

# Narrowed to what building and pushing the image requires.
permissions:
  contents: read
  packages: write

jobs:
  publish-snapshot-ghcr:
    name: Publish snapshot Docker image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Check for a snapshot version
        id: version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout --no-transfer-progress)
          if [[ "${VERSION}" == *-SNAPSHOT ]]; then
            echo "snapshot=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::notice::The Maven version ${VERSION} is not a snapshot - no snapshot image is published"
            echo "snapshot=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Login to GitHub Container Registry
        if: steps.version.outputs.snapshot == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        if: steps.version.outputs.snapshot == 'true'
        env:
          DOCKER_REPO: ghcr.io
        run: mvn clean package jib:build --no-transfer-progress
