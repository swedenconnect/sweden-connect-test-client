# Publishes the Docker image of a release when a version tag is pushed.
#
# The Maven version is set manually and committed before tagging, so the tag must match it: the tag v1.0.9 requires
# the version 1.0.9 in pom.xml. The image is tagged with the version and with latest.
name: Release Docker image

on:
  push:
    tags:
      - 'v*'

# Narrowed to what building and pushing the image requires.
permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish Docker image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Check that the tag matches the Maven version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout --no-transfer-progress)
          if [[ "${VERSION}" == *-SNAPSHOT ]]; then
            echo "::error::The Maven version ${VERSION} is a snapshot - set the release version in pom.xml before tagging"
            exit 1
          fi
          if [[ "${TAG}" != "v${VERSION}" ]]; then
            echo "::error::The tag ${TAG} does not match the Maven version ${VERSION} - expected the tag v${VERSION}"
            exit 1
          fi

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        env:
          DOCKER_REPO: ghcr.io
        run: mvn clean package jib:build -Djib.to.tags=latest --no-transfer-progress
