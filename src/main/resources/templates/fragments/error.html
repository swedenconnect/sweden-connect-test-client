<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head></head>
<body>

<div th:fragment="page(statusCode, title, description)">

  <nav class="navbar navbar-expand-lg bg-light fixed-top" data-bs-theme="light">
    <div class="container-fluid">
      <a class="navbar-brand" th:href="@{/}">
        <img th:src="@{/images/logo-notext.svg}" src="/images/logo-notext.svg" width="30" height="30"
             class="d-inline-block align-top" alt="Sweden Connect"/>
      </a>
    </div>
  </nav>

  <main class="container main" id="main">
    <div class="col-sm-12 content-container">
      <div class="row">
        <div class="col-sm-12">
          <h2 class="content-heading">
            <span th:text="${statusCode}">000</span> &ndash; <span th:text="${title}">Error</span>
          </h2>
          <p th:text="${description}">Something went wrong.</p>
          <p th:if="${path != null and !path.isEmpty()}">
            <span class="text-muted">Path: </span><span th:text="${path}">/some/path</span>
          </p>
          <p class="text-end">
            <a th:href="@{/}" class="btn btn-primary btn-sm">Back to start page &gt;&gt;&gt;</a>
          </p>
        </div>
      </div>
    </div>
  </main>

  <footer th:replace="~{fragments/footer :: copyright}"></footer>

</div>

</body>
</html>
