testclient:
  saml:
    federation:
      description: "Sweden Connect Local Development Federation"
      metadata-location: classpath:environments/localdev/metadata.xml
      #https://local.dev.swedenconnect.se:9000/metadata/mdx/role/idp.xml
      validation-certificate: classpath:environments/localdev/metadata.crt
      backup-location: target/metadata.xml
      tls:
        skip-hostname-verification: true
        default-tls-trust: TRUST_ALL
