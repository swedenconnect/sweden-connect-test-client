testclient:
  base-url: https://client.example.com
  default-credential:
    bundle: rsa-4096
  oidc:
    enabled: true
    openid-fed-authorities:
      - https://ta.example.com
    federation:
      enabled: true
      # No federation traffic is made during the test.
      auto-configure-ops: false
      organization-number: "2021006883"
      trust-anchors:
        - entity-id: https://ta.example.com
      entity-metadata:
        organization-name: "Sweden Connect"
        contacts:
          - operations@swedenconnect.se
    rps:
      - path-suffix: "testrp1"
        description: "Test OIDC RP 1"
        metadata: |
          {
            "response_types" : [ "code" ],
            "grant_types" : [ "authorization_code" ],
            "client_name" : "Sweden Connect Test-RP 1",
            "subject_type" : "pairwise",
            "token_endpoint_auth_method" : "private_key_jwt"
          }
        credentials:
          signing:
            bundle: rsa-4096
  saml:
    enabled: false
